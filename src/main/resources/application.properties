
# JPA
spring.jpa.show-sql=true

server.port=8080

# jdbc:log4jdbc: wraps the PostgreSQL driver so every SQL is logged with its values (see log4jdbc.log4j2.properties)
spring.datasource.url=jdbc:log4jdbc:postgresql://pg-c9eb0a7-phamtu24699-5017.i.aivencloud.com:13479/defaultdb?sslmode=require&stringtype=unspecified

spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

# Aiven free plan allows 15 connections in total
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# check a pooled connection with a real query: the log4jdbc wrapper does not report connections Aiven closed
spring.datasource.hikari.connection-test-query=SELECT 1
# give connections back before Aiven closes idle ones
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

spring.datasource.username=avnadmin

spring.datasource.password=AVNS_aVTRvQdZ3dviuFzu41s


# SQL of every mapper interface (com.web.nexacro.mapper.*)
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.default-statement-timeout=30
mybatis.configuration.auto-mapping-unknown-column-behavior=FAILING
spring.main.allow-bean-definition-overriding=true


log4j.rootLogger=ERROR, stdout

log4j.logger.org.mybatis.example.BlogMapper=TRACE

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout

# SQL is logged by log4jdbc (jdbc.sqltiming / jdbc.resultsettable), not by MyBatis
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# log4jdbc loggers: the SQL with its values and time, and the result as a table
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=INFO
logging.level.jdbc.resultsettable=INFO
logging.level.jdbc.sqlonly=OFF
logging.level.jdbc.audit=OFF
logging.level.jdbc.resultset=OFF
logging.level.jdbc.connection=OFF

spring.mvc.view.prefix: /WEB-INF/jsp/
spring.mvc.view.suffix: .jsp
# keep NULL columns in map results so every row has the same Nexacro columns
mybatis.configuration.call-setters-on-nulls=true

# product / supplier images (FileController); the 5 MB image limit is checked in the controller
# empty = <web app>/uploads (src/main/webapp/uploads when run from the project), works on every machine;
# set a folder (for example /data/kanban-uploads) to keep the images outside the app
app.upload-dir=
spring.servlet.multipart.max-file-size=10MB
